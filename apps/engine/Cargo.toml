[package]
name = "anasys-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
# Async Runtime
tokio = { version = "1.40", features = ["full"] }
futures-util = "0.3"

# Networking & Protocol
# rustls-tls-manual-roots: pakai ring, bukan aws-lc-rs (hindari GLIBC mismatch)
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
url = "2.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Storage & Messaging
# tokio-rustls-comp: rustls backend. Pastikan rustls pakai ring (via [patch] di bawah)
redis = { version = "0.27", features = ["tokio-comp", "json", "tokio-rustls-comp"] }

# Utils
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
rand = "0.9"

# TLS: eksplisit pakai ring agar semua crate transitif tidak pakai aws-lc-rs
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
aws-lc-rs = { version = "*", optional = true }  # disable default, jadikan optional

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = 'abort'
strip = true
