services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: finance_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-finance_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: oven/bun:1
    container_name: finance_backend
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-finance_db}
    command: bun run --filter "@apps/backend" dev
    ports:
      - "3000:3000"
    depends_on:
      - postgres

volumes:
  postgres_data:
