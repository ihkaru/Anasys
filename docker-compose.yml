name: anasys-prod

services:
  # ---------------------------------------------------------------------------
  # Performance Engine (Rust)
  # ---------------------------------------------------------------------------
  engine:
    build:
      context: .
      dockerfile: apps/engine/Dockerfile.prod
    restart: always
    environment:
      - REDIS_URL=redis://redis:6379
      - QUESTDB_URL=http://questdb:9000
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-finance_db}
      - ANASYS_SCRAPE_SYMBOLS=${ANASYS_SCRAPE_SYMBOLS:-BINANCE:BTCUSDT,BINANCE:ETHUSDT,FX:EURUSD}
    depends_on:
      redis:
        condition: service_healthy
      questdb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/engine_heartbeat -mmin -1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - anasys-net

  # ---------------------------------------------------------------------------
  # API Gateway (Bun)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.prod
    restart: always
    expose:
      - "3000"
    labels:
      - "coolify.managed=true"
      - "coolify.proxy.port=3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-finance_db}
      - REDIS_URL=redis://redis:6379
      - QUESTDB_URL=http://questdb:9000
      - JWT_SECRET=${JWT_SECRET} # Required in prod
    depends_on:
      postgres:
        condition: service_healthy
      questdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - anasys-net

  # ---------------------------------------------------------------------------
  # Frontend UI (Vue/Vite)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile.prod
    restart: always
    expose:
      - "80"
    labels:
      - "coolify.managed=true"
      - "coolify.proxy.port=80"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - anasys-net

  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-finance_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - anasys-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-finance_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  questdb:
    image: questdb/questdb:9.3.5
    restart: always
    environment:
      - QDB_CAIRO_COMMIT_LAG=5000
      - QDB_CAIRO_MAX_UNCOMMITTED_ROWS=10000
    volumes:
      - questdb_data:/root/.questdb
    networks:
      - anasys-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fL http://localhost:9000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.2.7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - anasys-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  anasys-net:
    driver: bridge

volumes:
  postgres_data:
  questdb_data:
  redis_data:
